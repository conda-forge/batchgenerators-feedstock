schema_version: 1

context:
  name: batchgenerators
  version: 0.25.6

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/batchgenerators-${{ version }}.tar.gz
  sha256: 6aabe8c3179410200b9a202d1a7c1699bd8a0633378af7656d4c452c2f1a1c35

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pillow >=7.1.2
    - numpy >=1.17
    - scipy
    - scikit-image
    - scikit-learn
    - pandas
    - threadpoolctl
tests:
  - python:
      imports:
        - batchgenerators
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Data augmentation toolkit
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/MIC-DKFZ/batchgenerators

extra:
  recipe-maintainers:
    - jan-janssen
